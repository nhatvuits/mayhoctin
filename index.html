<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mây Học Tin</title>
<meta name="description" content="Học Tin học và luyện thi IC3 Spark miễn phí cho học sinh tiểu học.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d9eeff">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mây Học Tin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Bầu trời của Mây: nền màu theo sở thích của bé (6 bộ màu), mây trắng làm thẻ, nắng vàng cho phần thưởng. Một cột 980px, lưới thẻ co về 1 cột trên điện thoại. */
  color-scheme:light;
  --sky:#d9eeff; --sky2:#f1f9ff; --cloud:#ffffff; --ink:#12305a; --muted:#516b8c;
  --blue:#1766d1; --blue-d:#0f4a9c; --on:#ffffff; --blue-soft:#e3f0ff; --line:#bcd6f0;
  --sun:#ffbf1f; --sun-d:#d99a00; --sun-soft:#fff3cf; --sun-ink:#3a2a00; --warn-ink:#8a5a00;
  --ok:#14885a; --ok-soft:#dff6ea; --bad:#cf3f2e; --bad-soft:#ffe6e1;
  --head:rgba(217,238,255,.94);
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px;
}
body[data-skin="pink"]{--sky:#ffd6e8;--sky2:#fff4f9;--ink:#5a1238;--muted:#8a4a6b;--blue:#d6247f;--blue-d:#a3165e;--blue-soft:#ffe3f0;--line:#f3b3d1;--head:rgba(255,214,232,.94)}
body[data-skin="purple"]{--sky:#e2d6ff;--sky2:#f7f3ff;--ink:#2e1a5e;--muted:#66588f;--blue:#7a3fe0;--blue-d:#5527a8;--blue-soft:#ece3ff;--line:#cbb9f3;--head:rgba(226,214,255,.94)}
body[data-skin="banana"]{--sky:#dff39a;--sky2:#f8fde8;--ink:#22400a;--muted:#587339;--blue:#357a00;--blue-d:#245400;--blue-soft:#e4f5c2;--line:#b9dc74;--sun:#ffd21f;--head:rgba(223,243,154,.94)}
body[data-skin="rainbow"]{--sky:#fff;--sky2:#fffdf7;--ink:#3a2166;--muted:#6b5c8a;--blue:#6a3fe0;--blue-d:#4a27a8;--blue-soft:#efe8ff;--line:#d9c8f5;--head:rgba(255,255,255,.9);
  --rb:linear-gradient(90deg,#ff5b5b,#ff9f1a,#e6b800,#3ec46d,#3a9bff,#8b5bff);--barbg:var(--rb);
  --bg:linear-gradient(135deg,#ffd9d9,#ffe8c4,#fff8bf,#d8f6c6,#cdeaff,#e4d8ff) fixed}
body[data-skin="night"]{color-scheme:dark;--sky:#16224d;--sky2:#0c1433;--cloud:#1c2a5c;--ink:#eef3ff;--muted:#aab7dc;--blue:#8fb1ff;--blue-d:#5a7fd6;--on:#0c1433;--blue-soft:#2a3a78;--line:#3a4b8a;
  --sun:#ffcf4a;--sun-d:#b98a00;--sun-soft:#4a3e14;--warn-ink:#ffdc85;--ok:#5fdca4;--ok-soft:#143f30;--bad:#ff9384;--bad-soft:#4d1f1a;--head:rgba(22,34,77,.94)}
*{box-sizing:border-box}
html,body{margin:0}
body{--bg:linear-gradient(var(--sky),var(--sky2) 420px) var(--sky2);font-family:var(--body);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6;min-height:100vh}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,5vw,40px)} h2{font-size:26px} h3{font-size:20px}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--head);backdrop-filter:blur(6px);border-bottom:3px solid var(--line);border-image:var(--rb,none) 1}
header.top .wrap{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:24px;text-decoration:none;color:var(--ink)}
.logo svg{width:46px;height:34px}
body[data-skin="rainbow"] .logo span{background:var(--rb);-webkit-background-clip:text;background-clip:text;color:transparent}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{text-decoration:none;color:var(--ink);font-weight:600;padding:8px 12px;border-radius:999px;font-size:16px}
.topnav a:hover{background:var(--cloud)}
.topnav a[aria-current="page"]{background:var(--blue);color:var(--on)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
.seg{display:inline-flex;border:2px solid var(--blue);border-radius:999px;overflow:hidden;background:var(--cloud)}
.seg button{border:0;background:none;padding:6px 12px;font-weight:700;font-size:14px;color:var(--blue)}
.seg button.on{background:var(--blue);color:var(--on)}
.toolbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--blue);border-radius:999px;background:var(--cloud);color:var(--blue);padding:5px 12px;font-weight:700;font-size:14px}
.toolbtn .ic{width:20px;height:20px}
.toolbtn.on{background:var(--blue);color:var(--on)}
.linkbtn{border:0;background:none;padding:0;color:var(--blue);font-weight:700;text-decoration:underline}
#panel:not(:empty){padding-top:16px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.sw{display:flex;flex-direction:column;gap:6px;align-items:stretch;border:3px solid var(--line);border-radius:16px;background:var(--cloud);padding:8px;font-weight:700;font-size:15px}
.sw i{display:block;height:54px;border-radius:10px;border:1px solid rgba(0,0,0,.12)}
.sw.on{border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.lbl{font-weight:700}
.field{border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:var(--sky2);width:min(100%,340px)}
main{padding:22px 0 60px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--cloud);border:2px solid var(--line);border-radius:var(--r);padding:20px}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero .cloud{width:150px;flex:none;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.hero .txt{flex:1 1 300px;display:flex;flex-direction:column;gap:10px}
.namebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--muted)}
.namebox input{width:190px;color:var(--ink)}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:var(--sun-soft);border-radius:14px;padding:8px 14px;font-weight:600;font-size:15px}
.stat b{font-family:var(--display);font-size:22px;margin-right:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:14px;border:2px solid var(--blue);background:var(--cloud);color:var(--blue);font-weight:700;text-decoration:none}
.btn.primary{background:var(--blue);color:var(--on);box-shadow:0 4px 0 var(--blue-d)}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-d)}
.btn.sun{background:var(--sun);border-color:var(--sun-d);color:var(--sun-ink);box-shadow:0 4px 0 var(--sun-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);background:var(--cloud);border:2px solid var(--line);border-radius:var(--r);padding:16px;border-top:8px solid var(--tc);transition:transform .15s}
.tcard:hover{transform:translateY(-3px);box-shadow:0 6px 0 var(--line)}
.tcard .hd{display:flex;gap:12px;align-items:center}
.tcard .n{font-size:13px;font-weight:700;color:var(--muted)}
.icb{width:46px;height:46px;border-radius:14px;background:var(--tc);color:#fff;display:grid;place-items:center;flex:none}
.ic{width:26px;height:26px}
.tcard p{font-size:15px;color:var(--muted)}
.tcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;font-size:14px;font-weight:600}
.stars{letter-spacing:2px;font-size:20px;color:var(--line)}
.stars b{color:var(--sun);font-weight:400}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--blue-soft);color:var(--blue)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--sun-soft);color:var(--warn-ink)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.none{background:var(--sky2);color:var(--muted)}
.lesson{display:flex;flex-direction:column;gap:8px}
.lesson .no{font-family:var(--display);font-weight:800;color:var(--blue);font-size:15px}
.lesson p,.lesson li{max-width:65ch}
.lesson ul{margin:0;padding-left:22px}
.tip{background:var(--sun-soft);border:2px dashed var(--sun-d);border-radius:var(--r);padding:16px 20px}
kbd{font-family:var(--body);font-weight:700;background:var(--sky2);border:2px solid var(--line);border-bottom-width:4px;border-radius:8px;padding:0 7px;font-size:.9em;white-space:nowrap}
.back{font-weight:600;color:var(--blue);text-decoration:none}
hr.dot{border:0;border-top:2px dotted var(--line);width:100%;margin:0}
.work-top{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;font-size:15px}
.work-top b{font-family:var(--display);font-size:20px;margin-right:auto}
.timer{font-variant-numeric:tabular-nums;font-weight:700;background:var(--blue);color:var(--on);border-radius:10px;padding:2px 12px}
.timer.low{background:var(--bad);color:#fff}
.bar{height:14px;background:var(--blue-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--barbg,var(--sun));border-radius:999px;transition:width .3s}
.qtype{font-size:14px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.04em}
.qtext{font-size:21px;font-weight:600;line-height:1.4;max-width:60ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;min-height:54px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--cloud);width:100%}
.opt .mk{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--sky2)}
.opt.sq .mk{border-radius:8px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)} .opt.sel .mk{background:var(--blue);color:var(--on);border-color:var(--blue)}
.ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.opt:disabled{cursor:default;color:var(--ink)}
.srow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-bottom:2px dotted var(--line)}
.srow span{font-weight:600;flex:1 1 180px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:42px;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--cloud);font-weight:600;font-size:15px}
.chip.sel{background:var(--blue);border-color:var(--blue);color:var(--on)}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--bad)}
.fb{border-radius:var(--r);padding:16px 20px;border:2px solid;animation:pop .25s}
@keyframes pop{from{transform:scale(.96);opacity:.4}}
.fb.good{background:var(--ok-soft);border-color:var(--ok)} .fb.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{margin-bottom:4px}
.palette{display:flex;flex-wrap:wrap;gap:6px}
.palette button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--cloud);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.palette .done{background:var(--blue-soft);border-color:var(--blue)}
.palette .flag{box-shadow:inset 0 -6px 0 var(--sun)}
.palette .cur{outline:3px solid var(--ink)}
.sim{border:2px solid var(--line);border-radius:14px;background:var(--sky2);padding:12px;overflow-x:auto}
.wordui{display:flex;gap:6px;flex-wrap:wrap}
.wordui .sep{width:2px;background:var(--line);margin:4px 4px}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;min-height:46px;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--cloud);font-weight:800;font-size:19px;justify-content:center}
.tb small{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.tb .ic{width:24px;height:24px}
.tb.sel,.xl button.sel,.key.sel{border-color:var(--blue);background:var(--blue-soft)}
.xl{border-collapse:collapse;font-variant-numeric:tabular-nums}
.xl th{background:var(--blue-soft);font-weight:700;font-size:14px;min-width:34px;padding:4px 8px;border:1px solid var(--line)}
.xl td{padding:0;border:1px solid var(--line)}
.xl button,.xl .cell{display:block;width:84px;height:38px;border:2px solid transparent;background:var(--cloud);font-size:14px;line-height:34px;text-align:center}
.xl .hl{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.kb{display:flex;flex-direction:column;gap:5px;min-width:560px}
.kb .kr{display:flex;gap:5px}
.key{flex:1 1 0;min-width:0;height:40px;border-radius:8px;border:2px solid var(--line);border-bottom-width:4px;background:var(--cloud);font-size:13px;font-weight:600;padding:0;text-transform:uppercase}
.key.wide{text-transform:none;font-size:12px}
div.key{display:grid;place-items:center}
.key.next{background:var(--sun);border-color:var(--sun-d);color:var(--sun-ink)}
button.key:active{transform:translateY(2px);border-bottom-width:2px}
.typeline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(20px,4vw,30px);letter-spacing:.06em;line-height:1.7;word-break:break-word}
.typeline .d{color:var(--ok)} .typeline .c{background:var(--sun);color:var(--sun-ink);border-radius:6px;padding:0 2px} .typeline .r{color:var(--muted)}
#type-in{border-color:var(--blue)}
.shake{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.flash{min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:8px;background:var(--blue);color:var(--on);border-radius:var(--r);padding:24px;border:2px solid var(--blue);width:100%}
.flash .en{font-family:var(--display);font-size:38px;font-weight:800}
.flash.flip{background:var(--cloud);color:var(--ink)}
.flash .vi{font-family:var(--display);font-size:28px;font-weight:700;color:var(--blue)}
.tablebox{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--blue-soft);vertical-align:top}
table.t th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.tbar{height:10px;border-radius:999px;background:var(--blue-soft);min-width:90px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ok)}
.big{font-family:var(--display);font-weight:800;font-size:56px;line-height:1}
.muted{color:var(--muted);font-size:15px}
footer{padding:0 0 40px;color:var(--muted);font-size:14px;text-align:center}
.hero.compact{gap:14px 20px;padding:16px 20px}
.hero.compact .cloud{width:104px}
.hero.compact .txt{gap:6px}
.hero.compact .stat{padding:4px 12px}
.mission{flex:1 1 100%;display:flex;flex-direction:column;gap:10px;background:var(--blue-soft);border-radius:14px;padding:14px 16px}
.mtxt{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.25}
.mission .bar{background:var(--cloud)}
.tcard .tbar{min-width:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;border:2px dashed var(--line);border-radius:14px;padding:12px 8px;color:var(--muted);font-size:14px;line-height:1.3}
.badge .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sky2);color:var(--line)}
.badge small{font-size:12px}
.badge.got{border-style:solid;border-color:var(--sun-d);background:var(--sun-soft);color:var(--ink)}
.badge.got .bi{background:var(--sun);color:var(--sun-ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;background:var(--sun);color:var(--sun-ink);font-weight:700;border:2px solid var(--sun-d);border-radius:999px;padding:10px 20px;max-width:calc(100% - 32px);text-align:center;animation:pop .25s}
#tabbar{display:none}
.seg .short{display:none}
.ta{width:100%;min-height:74px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;resize:vertical}
.chip.sm{min-height:32px;padding:2px 10px;font-size:13px}
.chip:disabled{opacity:.4;cursor:not-allowed}
.try{border:2px dashed var(--blue);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--sky2);margin-top:6px}
.lwbody{display:flex;flex-direction:column;gap:10px}
.msg{font-weight:600}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:20px}
.node{display:inline-block;padding:6px 12px;border-radius:10px;border:2px solid var(--line);background:var(--cloud);font-weight:700;font-size:16px}
.node.pc{border-color:var(--blue);color:var(--blue)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.box{border:2px solid var(--line);border-radius:12px;background:var(--cloud);padding:10px;min-height:86px}
.box h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-family:var(--body)}
.doc{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--blue-soft);font-weight:600;font-size:14px;margin:2px}
.frow{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.units{display:flex;flex-direction:column;gap:8px}
.urow{display:grid;grid-template-columns:52px 1fr minmax(110px,auto);gap:10px;align-items:center;font-size:15px}
.tree{list-style:none;margin:0;padding-left:22px}
.tree.root{padding-left:0}
.tree button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:5px 8px;border-radius:8px;text-align:left;min-height:38px}
.tree button.on{background:var(--blue-soft)}
.tree .ic{width:20px;height:20px;color:var(--blue);flex:none}
.desk{background:var(--blue-soft);border-radius:10px;padding:10px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.mwin{border:2px solid var(--ink);border-radius:10px;background:var(--cloud);overflow:hidden;width:62%;transition:width .2s}
.mwin.max{width:100%}
.mbar{display:flex;justify-content:space-between;align-items:center;background:var(--sky2);padding:2px 4px 2px 10px;font-size:14px;font-weight:700}
.mbar button{width:38px;height:32px;border:0;background:none;font-weight:800;font-size:18px;border-radius:6px}
.mbar button:hover{background:var(--blue-soft)}
.mbody{padding:18px;min-height:64px;color:var(--muted)}
.tbr{background:var(--ink);border-radius:8px;padding:4px;display:flex;gap:6px;align-items:center}
.tbr span,.tbr button{font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;border:0;background:var(--cloud);color:var(--ink)}
.delt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;letter-spacing:.12em}
.cur{display:inline-block;width:3px;height:1.2em;background:var(--bad);vertical-align:middle;margin:0 2px}
.pv{border:2px solid var(--line);background:var(--cloud);border-radius:10px;padding:14px;min-height:76px}
.cellin{display:block;width:84px;height:38px;border:2px solid transparent;background:var(--cloud);text-align:center;font-size:15px}
.cellin:focus{border-color:var(--blue);outline:0}
.chartsvg{width:min(100%,340px);height:auto;color:var(--ink)}
.chartsvg text{font-size:12px;font-weight:600;fill:currentColor;font-family:var(--body)}
.stage{position:relative;height:150px;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--cloud)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font-size:18px}
.s1{background:var(--blue-soft)} .s2{background:var(--sun-soft)}
.sl.out{animation:slout .9s forwards} .sl.in{animation:slin .9s both} .fly{animation:fly .9s both}
@keyframes slout{to{transform:translateX(-100%)}}
@keyframes slin{from{transform:translateX(100%)}}
@keyframes fly{from{transform:translateX(-160%);opacity:0}}
.urlrow{display:flex;flex-wrap:wrap}
.upart{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:clamp(16px,3.6vw,22px);font-weight:700;border:2px solid var(--line);border-left-width:0;background:var(--cloud);padding:8px 8px;min-height:46px}
.upart:first-child{border-left-width:2px;border-radius:10px 0 0 10px}.upart:last-child{border-radius:0 10px 10px 0}
.upart.sel{background:var(--blue);color:var(--on);border-color:var(--blue)}
.meter{height:12px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.meter i{display:block;height:100%;transition:width .2s}
.sms{border:2px solid var(--line);border-radius:14px;background:var(--cloud);padding:12px}
.seg1{border:0;background:none;padding:4px 4px;border-radius:6px;text-align:left;font-weight:500;min-height:36px}
.seg1:hover{background:var(--sky2)}
.seg1.f{background:var(--bad-soft);color:var(--bad);font-weight:700}
.seg1.n{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--sun-soft);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
.tile b{font-family:var(--display);font-size:30px;line-height:1.1}
.tile span{font-size:13px;font-weight:600}
.rbars{display:flex;flex-direction:column;gap:8px}
.rrow{display:grid;grid-template-columns:minmax(110px,1.1fr) 2fr 46px;gap:10px;align-items:center;font-size:14px}
.rbar{position:relative;height:16px;border-radius:999px;background:var(--blue-soft);overflow:hidden}
.rbar i{display:block;height:100%;border-radius:999px}
.rbar em{position:absolute;left:70%;top:0;bottom:0;width:2px;background:var(--ink)}
.rv{text-align:right;font-weight:700}
.excols{display:flex;gap:12px;align-items:flex-end;overflow-x:auto;padding-top:4px}
.exc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700}
.exc i{display:block;width:28px;border-radius:6px 6px 0 0}
.exc small{color:var(--muted);font-weight:600}
.cert{background:#fffdf5;color:#12305a;border:6px double #d99a00;border-radius:18px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.cert .cloud{width:110px}
.cert .ct{font-family:var(--display);font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:.06em;color:#b86a00;line-height:1}
.cert .cn{font-family:var(--display);font-size:clamp(30px,7vw,54px);font-weight:800;border-bottom:3px solid #ffbf1f;padding:0 24px;line-height:1.2}
.cert .cs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cert .cs span{background:#fff3cf;border-radius:999px;padding:4px 14px;font-weight:700;font-size:15px}
.cert small{color:#516b8c;max-width:60ch}
.cert.locked{opacity:.5;filter:grayscale(.7)}
@media (max-width:700px){.topnav{display:none}header.top{position:static}.seg .full{display:none}.seg .short{display:inline}.tools{margin-left:auto}
 #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cloud);border-top:2px solid var(--line);justify-content:space-around;padding:4px 2px}
 #tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;line-height:1.2;padding:4px 2px;border-radius:12px;min-height:50px}
 #tabbar a[aria-current="page"]{color:var(--blue);background:var(--blue-soft)}
 #tabbar .ic{width:24px;height:24px}
 body{padding-bottom:66px}.toast{bottom:78px}.rrow{grid-template-columns:1fr 46px}.rrow .rbar{grid-column:1/-1;grid-row:2}.urow{grid-template-columns:44px 1fr}.urow span{grid-column:1/-1}}
@media print{header.top,#tabbar,#panel,footer,.noprint,.toast,.cfbox{display:none!important}body{background:#fff!important;padding:0}main{padding:0}.card,.cert{break-inside:avoid}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
.tg-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tg-gh{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:6px}
.tg-gh i{width:14px;height:14px;border-radius:50%}
.tg-grp .chip{display:inline-flex;align-items:center;gap:6px;text-align:left}
.tg-grp .chip .stars{font-size:14px;letter-spacing:0}
.chip.sel .stars{color:rgba(255,255,255,.45)}
.tg-scene{position:relative;height:250px;border-radius:16px;overflow:hidden;border:2px solid var(--line);background:#cfeeff}
.tg-bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tg-may{position:absolute;top:6px;width:86px;transition:left .25s ease-out;pointer-events:none}
.tg-may .cloud{width:100%;display:block;animation:bob 3s ease-in-out infinite}
.tg-line{position:absolute;left:12px;right:12px;top:92px;background:rgba(255,255,255,.88);border-radius:14px;padding:6px 14px;text-align:center;color:#12305a;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:clamp(20px,4.2vw,34px);letter-spacing:.06em;line-height:1.5;word-break:break-word}
.tg-line .d{color:#14885a}.tg-line .r{color:#12305a}
.tg-line .c{background:#ffbf1f;color:#3a2a00;border-radius:6px;padding:0 3px;outline:2px solid #12305a}
.it{opacity:0;transform:scale(.2);transform-box:fill-box;transform-origin:50% 100%;transition:transform .4s cubic-bezier(.3,1.7,.5,1),opacity .2s}
.it.on{opacity:1;transform:scale(1)}
.tg-tip{font-weight:600;text-align:center}
.tg-kb .key.zp{background:#ffb3a8}.tg-kb .key.zr{background:#ffe08a}.tg-kb .key.zm{background:#a9e6c1}.tg-kb .key.zi{background:#b3d4ff}.tg-kb .key.zt{background:#d9c7ff}
.tg-kb .key.zp,.tg-kb .key.zr,.tg-kb .key.zm,.tg-kb .key.zi,.tg-kb .key.zt{color:#12305a;border-color:rgba(18,48,90,.3)}
.tg-kb .key.next{position:relative;z-index:1;outline:3px solid var(--ink);box-shadow:0 0 0 6px var(--sun);transform:translateY(-3px) scale(1.1)}
.hands{width:min(100%,420px);height:auto;align-self:center}
.stars.big{font-size:40px}
.q-type{width:min(100%,360px);font-size:20px;font-weight:600;border-width:2px;border-style:solid}
.lvbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1 1 100%}
.lvbar button{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;border:2px solid var(--line);border-radius:14px;background:var(--cloud);padding:8px 12px;min-height:54px}
.lvbar button b{font-family:var(--display);font-size:18px;line-height:1.2}
.lvbar button span{font-size:13px;color:var(--muted);font-weight:600}
.lvbar button.on{border-color:var(--blue);background:var(--blue);color:var(--on);box-shadow:0 4px 0 var(--blue-d)}
.lvbar button.on span{color:var(--on);opacity:.9}
@media (max-width:520px){.lvbar button{padding:6px 8px}.lvbar button b{font-size:15px}.lvbar button span{font-size:11px}}
.cfbox{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.cfbox i{position:absolute;top:-16px;width:10px;height:15px;border-radius:2px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@media (max-width:520px){.hero .cloud,.hero.compact .cloud{width:72px}.card{padding:16px}.qtext{font-size:19px}.toolbtn span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
